name: Build Release APK

on:
  workflow_dispatch:        # 允许在 Actions 页面手动触发
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_FILE: ${{ github.workspace }}/app/release.keystore
      KEYSTORE_PWD: ${{ secrets.KEYSTORE_PWD }}
      KEY_ALIAS: clicker
      KEY_PWD: ${{ secrets.KEY_PWD }}
    steps:
      - name: 拉取代码
        uses: actions/checkout@v5

      - name: 配置 JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装编译所需 SDK 组件
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: 赋予 gradlew 可执行权限
        run: chmod +x gradlew

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true     # 关闭 Gradle 缓存，避免 cache 服务抖动导致报错

      - name: 生成签名 keystore
        run: |
          export PATH=$JAVA_HOME/bin:$PATH
          # 默认密码兜底（≥6位），Secrets 可选不设
          KPWD="${KEYSTORE_PWD:-clicker2026}"
          KEY="${KEY_PWD:-clicker2026}"
          keytool -genkeypair -v \
            -keystore "$KEYSTORE_FILE" \
            -alias "$KEY_ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$KPWD" -keypass "$KEY" \
            -dname "CN=Dev,OU=Dev,O=Dev,L=City,S=State,C=CN"
          # 把实际使用的密码同步给后续 Gradle 步骤，避免 keytool 与 gradle 读取不一致
          {
            echo "KEYSTORE_PWD=$KPWD"
            echo "KEY_PWD=$KEY"
          } >> "$GITHUB_ENV"

      - name: 编译 Release APK
        run: ./gradlew assembleRelease

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release.apk
