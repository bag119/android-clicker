plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.creation.city.clicker'
    compileSdk 34

    defaultConfig {
        applicationId 'com.creation.city.clicker'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        release {
            def ksFile = System.getenv('KEYSTORE_FILE') ?: 'release.keystore'
            def ksPwd = System.getenv('KEYSTORE_PWD') ?: 'clicker2026'
            def ksAlias = System.getenv('KEY_ALIAS') ?: 'clicker'
            def keyPwd = System.getenv('KEY_PWD') ?: 'clicker2026'
            storeFile file(ksFile)
            storePassword ksPwd
            keyAlias ksAlias
            keyPassword keyPwd
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
